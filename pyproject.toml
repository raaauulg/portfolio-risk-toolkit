[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "miax-toolkit"
version = "0.1.0"
description = "Herramientas de análisis financiero para el taller B1-T1 de MIAX"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas==3.1.0",
    "numpy>=2.0",
    "yfinance==1.7.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]