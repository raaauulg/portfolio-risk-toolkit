# Configuración del dashboard (streamlit run app/dashboard.py, desde la raíz del repositorio).

[browser]
# Sin telemetría: la app no debe hacer llamadas de red en modo sin conexión.
gatherUsageStats = false

[client]
# Sin tracebacks en pantalla: los errores se muestran con mensajes propios
# y el detalle técnico va a la consola.
showErrorDetails = "none"
toolbarMode = "minimal"
showSidebarNavigation = false

[runner]
magicEnabled = false

[theme]
# Claro por defecto: se ve mejor con proyector. Una sola tipografía: la del sistema.
base = "light"
font = "sans-serif"
baseRadius = "small"
showWidgetBorder = true
chartCategoricalColors = ["#2a78d6", "#eb6834", "#1baf7a", "#eda100", "#e87ba4", "#008300", "#6250d6", "#e34948"]

[theme.light]
primaryColor = "#1c5cab"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f6f6f3"
textColor = "#0b0b0b"
linkColor = "#1c5cab"
borderColor = "#d9d8d2"

[theme.dark]
primaryColor = "#6da7ec"
backgroundColor = "#141413"
secondaryBackgroundColor = "#1f1f1d"
textColor = "#f0efec"
linkColor = "#6da7ec"
borderColor = "#3a3a37"
